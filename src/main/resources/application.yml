spring:
  application:
    name: ocr-expense-tracker
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

logging:
  level:
    root: INFO
    com.benson.ocr_expense_tracker: DEBUG

azure:
  document-intelligence:
    endpoint: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:https://doc-intel-ocr-expense-tracker.cognitiveservices.azure.com/}
  open-ai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:https://openai-ocr-expense-tracker.openai.azure.com/}
    deployment-name: ${AZURE_OPENAI_DEPLOYMENT:gpt-5.4-mini}
    api-version: ${AZURE_OPENAI_API_VERSION:2026-03-17}